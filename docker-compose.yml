services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    env_file: .env
    command: sh -c "python manage.py migrate && python manage.py sync_prompts && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 300"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media   # 上传视频/封面/成品，与 worker、nginx 共享
      - ./backend/flow3/prompts:/app/flow3/prompts   # Agent 提示词文件：界面保存直接落宿主，可 git 提交
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    env_file: .env
    command: celery -A config worker --loglevel=INFO
    volumes:
      - media_data:/app/media   # worker 生成封面、合并成品，写入同一卷
    depends_on:
      backend:
        condition: service_started

  # 流程一：Remotion 渲染服务（Node + 无头 Chromium）。worker 通过 HTTP 触发，
  # 封面/音频/成品经共享 media 卷交换（路径与 backend/worker 一致：/app/media）。
  render:
    build: ./render
    volumes:
      - media_data:/app/media
    # 仅供内网调用，不对外暴露端口

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro   # nginx 直接托管 media 静态文件
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  media_data:
